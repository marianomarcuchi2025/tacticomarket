<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ingreso — TácticoMarket</title>
  <meta name="description" content="Comunidad privada de compra, venta, servicios y ayuda mutua entre miembros de las Fuerzas Armadas argentinas.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%9A%3C/text%3E%3C/svg%3E">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TácticoMarket">
  <meta property="og:title" content="Ingreso — TácticoMarket">
  <meta property="og:description" content="Comunidad privada de compra, venta, servicios y ayuda mutua entre miembros de las Fuerzas Armadas argentinas.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Ingreso — TácticoMarket">
  <meta name="twitter:description" content="Comunidad privada de compra, venta, servicios y ayuda mutua entre miembros de las Fuerzas Armadas argentinas.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <div class="header-inner">
    <a class="brand" href="index.html"><span class="brand-mark">💚</span>TácticoMarket</a>
    <nav>
      <a href="index.html">Inicio</a>
    </nav>
  </div>
</header>

<div class="container">
  <div class="card">
    <div class="tabs">
      <button type="button" class="tab-btn active" id="tabIngresar">Ingresar</button>
      <button type="button" class="tab-btn" id="tabRegistrar">Crear cuenta</button>
    </div>

    <form id="formIngresar">
      <input type="email" id="loginEmail" placeholder="Email" required autocomplete="username">
      <input type="password" id="loginPassword" placeholder="Contraseña" class="mt-sm" required autocomplete="current-password">
      <button type="submit" class="btn mt-md">Ingresar</button>
    </form>

    <form id="formRegistrar" hidden>
      <input type="text" id="regNombre" placeholder="Nombre completo" required>
      <select id="regTipo" class="mt-sm" required>
        <option value="militar">Militar</option>
        <option value="civil">Civil</option>
        <option value="familiar">Familiar de militar</option>
      </select>
      <input type="text" id="regFuerza" placeholder="Fuerza (EA / FAA / ARA) — si aplica" class="mt-sm">
      <input type="text" id="regUnidad" placeholder="Unidad de destino (opcional)" class="mt-sm">
      <input type="text" id="regCallsign" placeholder="Alias público (opcional, ej: HALCON04)" class="mt-sm">
      <input type="email" id="regEmail" placeholder="Email" class="mt-sm" required autocomplete="username">
      <input type="password" id="regPassword" placeholder="Contraseña (mínimo 6 caracteres)" class="mt-sm" required minlength="6" autocomplete="new-password">
      <button type="submit" class="btn mt-md">Crear cuenta</button>
    </form>

    <p class="hint mt-md">Al crear tu cuenta, un administrador va a revisar y aprobar tu acceso antes de que puedas publicar o escribir a otros miembros.</p>
    <p id="authError" class="fine-print error-text hidden"></p>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
<script src="js/nav-active.js"></script>
</body>
</html>
