<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ingreso — TácticoMarket</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header><nav><a href="index.html">Inicio</a></nav></header>

<div class="container">
  <div class="card">
    <div class="tabs">
      <button type="button" class="tab-btn active" id="tabIngresar">Ingresar</button>
      <button type="button" class="tab-btn" id="tabRegistrar">Crear cuenta</button>
    </div>

    <form id="formIngresar">
      <input type="email" id="loginEmail" placeholder="Email" required autocomplete="username">
      <input type="password" id="loginPassword" placeholder="Contraseña" class="mt-sm" required autocomplete="current-password">
      <button type="submit" class="btn mt-md">Ingresar</button>
    </form>

    <form id="formRegistrar" hidden>
      <input type="text" id="regNombre" placeholder="Nombre completo" required>
      <select id="regTipo" class="mt-sm" required>
        <option value="militar">Militar</option>
        <option value="civil">Civil</option>
        <option value="familiar">Familiar de militar</option>
      </select>
      <input type="text" id="regFuerza" placeholder="Fuerza (EA / FAA / ARA) — si aplica" class="mt-sm">
      <input type="text" id="regUnidad" placeholder="Unidad de destino (opcional)" class="mt-sm">
      <input type="text" id="regCallsign" placeholder="Alias público (opcional, ej: HALCON04)" class="mt-sm">
      <input type="email" id="regEmail" placeholder="Email" class="mt-sm" required autocomplete="username">
      <input type="password" id="regPassword" placeholder="Contraseña (mínimo 6 caracteres)" class="mt-sm" required minlength="6" autocomplete="new-password">
      <button type="submit" class="btn mt-md">Crear cuenta</button>
    </form>

    <p class="hint mt-md">Al crear tu cuenta, un administrador va a revisar y aprobar tu acceso antes de que puedas publicar o escribir a otros miembros.</p>
    <p id="authError" class="fine-print error-text hidden"></p>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
