<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin — TácticoMarket</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header><nav><a href="index.html">Inicio</a> · <a href="publicaciones.html">Publicaciones</a></nav></header>

<div class="container">
  <h1>Panel de administración</h1>

  <div class="card mt-md" style="text-align:left">
    <h3>Cuentas pendientes de verificación</h3>
    <div id="pendientes"><p class="hint">Cargando...</p></div>
  </div>

  <div class="card mt-md" style="text-align:left">
    <h3>Agregar punto de encuentro seguro</h3>
    <p class="hint">Solo cargá direcciones reales y verificadas (comisaría, estación de servicio, supermercado, comercio adherido).</p>
    <input type="text" id="puntoNombre" placeholder="Nombre del lugar">
    <select id="puntoTipo" class="mt-sm">
      <option value="comisaria">Comisaría</option>
      <option value="estacion_servicio">Estación de servicio</option>
      <option value="supermercado">Supermercado</option>
      <option value="comercio_adherido">Comercio adherido</option>
    </select>
    <input type="text" id="puntoDireccion" placeholder="Dirección" class="mt-sm">
    <input type="text" id="puntoProvincia" placeholder="Provincia" class="mt-sm">
    <button type="button" class="btn mt-sm" id="agregarPuntoBtn">Agregar</button>
    <p id="puntoMsg" class="fine-print"></p>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
