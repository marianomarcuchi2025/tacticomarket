<meta name="twitter:title" content="TácticoMarket — Donaciones">

<body>
<header>
  <div class="header-inner">
    <a class="brand" href="index.html"><span class="brand-mark">💚</span>TácticoMarket</a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="login.html">Ingresar</a>
      <a href="publicaciones.html">Publicaciones</a>
      <a href="dashboard.html">Mapa</a>
    </nav>
  </div>
</header>

<div class="container">
  <div class="card">
    <h1 class="title-hero">💚 TÁCTICO MARKET</h1>
    <h2>Donación voluntaria</h2>
    <p>Elegí el monto para ayudar a mantener la plataforma gratuita</p>

    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    <div id="stats">Recaudado: $12.500 / Meta: $500.000</div>

    <div class="grid">
      <button type="button" class="monto-btn" data-monto="1000">$1.000</button>
      <button type="button" class="monto-btn" data-monto="2500">$2.500</button>
      <button type="button" class="monto-btn" data-monto="5000">$5.000</button>
      <button type="button" class="monto-btn" data-monto="10000">$10.000</button>
      <button type="button" class="monto-btn" data-monto="20000">$20.000</button>
      <button type="button" class="monto-btn" data-monto="50000">$50.000</button>
    </div>

    <input type="number" id="customMonto" placeholder="Otro monto (ARS)">
    <input type="text" id="donanteNombre" placeholder="Tu nombre (opcional)" class="mt-sm">
    <input type="text" id="mensaje" placeholder="Mensaje de apoyo (opcional)" class="mt-sm">

    <button type="button" id="donarBtn" class="btn">💚 DONAR CON MERCADO PAGO</button>
    <p id="donarMsg" class="fine-print hidden"></p>
    <p class="fine-print">🔒 Pagos seguros. El dinero va directamente a TácticoMarket.</p>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/donate.js"></script>
<script src="js/nav-active.js"></script>
</body>
