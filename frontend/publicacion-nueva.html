<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nueva publicación — TácticoMarket</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%9A%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <div class="header-inner">
    <a class="brand" href="index.html"><span class="brand-mark">💚</span>TácticoMarket</a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="publicaciones.html">Publicaciones</a>
    </nav>
  </div>
</header>

<div class="container">
  <div class="card text-left">
    <h1 class="text-center">Nueva publicación</h1>

    <form id="formPublicacion">
      <label class="label">Categoría</label>
      <select id="categoria" required>
        <option value="venta">Venta de un producto</option>
        <option value="servicio">Ofrezco un servicio</option>
        <option value="mudanza">Ayuda con una mudanza</option>
        <option value="alquiler">Alquiler</option>
        <option value="movilidad">Viaje / movilidad</option>
        <option value="ayuda">Pido ayuda / colecta</option>
        <option value="otro">Otro</option>
      </select>

      <input type="text" id="titulo" placeholder="Título" class="mt-sm" required maxlength="120">
      <textarea id="descripcion" placeholder="Descripción" class="mt-sm" rows="4" required maxlength="2000"></textarea>
      <input type="text" id="ubicacion" placeholder="Provincia / ubicación" class="mt-sm">

      <div id="campoPrecio">
        <input type="number" id="precio" placeholder="Precio (opcional, en ARS)" class="mt-sm" min="0">
        <input type="text" id="unidad" placeholder="Unidad (ej: por hora, precio único)" class="mt-sm">
      </div>

      <div id="campoColecta" hidden>
        <input type="number" id="metaColecta" placeholder="Meta de la colecta (ARS)" class="mt-sm" min="100">
      </div>

      <label class="label mt-md">Foto (opcional, máx. 5MB)</label>
      <input type="file" id="imagen" accept="image/png,image/jpeg,image/webp">

      <button type="submit" class="btn mt-md">Publicar</button>
      <p id="publicarError" class="fine-print error-text hidden"></p>
    </form>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/guard.js"></script>
<script src="js/publicacion-nueva.js"></script>
<script src="js/nav-active.js"></script>
</body>
</html>
