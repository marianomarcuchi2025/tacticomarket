<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Publicaciones — TácticoMarket</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <nav>
    <a href="index.html">Inicio</a> ·
    <a href="publicaciones.html">Publicaciones</a> ·
    <a href="dashboard.html">Mapa</a> ·
    <a href="admin.html" id="navAdmin" hidden>Admin</a> ·
    <button type="button" id="logoutBtn" style="display:inline;padding:2px 10px;font-size:12px;border-radius:20px">Salir</button>
  </nav>

<div class="container">
  <h1>Publicaciones</h1>
  <p class="hint">Vendé, ofrecé un servicio, pedí ayuda con una mudanza, un alquiler o cualquier otra cosa entre miembros.</p>

  <div class="category-tabs" id="categoryTabs">
    <button type="button" class="tab-btn active" data-categoria="">Todas</button>
    <button type="button" class="tab-btn" data-categoria="venta">Venta</button>
    <button type="button" class="tab-btn" data-categoria="servicio">Servicios</button>
    <button type="button" class="tab-btn" data-categoria="mudanza">Mudanzas</button>
    <button type="button" class="tab-btn" data-categoria="alquiler">Alquileres</button>
    <button type="button" class="tab-btn" data-categoria="movilidad">Movilidad</button>
    <button type="button" class="tab-btn" data-categoria="ayuda">Ayuda / colecta</button>
    <button type="button" class="tab-btn" data-categoria="otro">Otro</button>
  </div>

  <a href="publicacion-nueva.html" class="btn mt-sm" style="display:inline-block;text-decoration:none">+ Nueva publicación</a>

  <div id="listado" class="mt-md">
    <p class="hint">Cargando...</p>
  </div>
</div>
